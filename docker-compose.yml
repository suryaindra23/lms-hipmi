services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: lms-object-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sunrise-local
      MINIO_ROOT_PASSWORD: sunrise-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
